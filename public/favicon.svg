  <!-- Center purple bar -->
  <rect x="13.5" y="7" width="5" height="18" rx="1" fill="#8B2FC9"/>
  <!-- Right gold bar -->
  <rect x="20" y="7" width="5" height="18" rx="1" fill="#F2B705"/>
</svg>
